<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function updateFields() {
            let disease = document.getElementById("disease").value;
            let inputFields = document.getElementById('input-fields');
            inputFields.innerHTML = '';
        
            
        
            let diseaseSpecificFields = '';
        
            if (disease === 'diabetes') {
                diseaseSpecificFields = `
                    <div class="mb-3"><label for="age" class="form-label">Age:</label>
                    <input type="number" class="form-control" id="age" name="age" required></div>
                
                    <div class="mb-3"><label for="pregnancies">Pregnancies:</label>
                    <input type="number" class="form-control" id="pregnancies" name="pregnancies" required></div>
        
                    <div class="mb-3"><label for="glucose">Glucose Level:</label>
                    <input type="number" class="form-control" id="glucose" name="glucose" required></div>
        
                    <div class="mb-3"><label for="blood_pressure">Blood Pressure:</label>
                    <input type="number" class="form-control" id="blood_pressure" name="blood_pressure" required></div>
        
                    <div class="mb-3"><label for="skin_thickness">Skin Thickness:</label>
                    <input type="number" class="form-control" id="skin_thickness" name="skin_thickness" required></div>
        
                    <div class="mb-3"><label for="insulin">Insulin Level:</label>
                    <input type="number" class="form-control" id="insulin" name="insulin" required></div>
        
                    <div class="mb-3"><label for="bmi">BMI:</label>
                    <input type="number" step="0.001" class="form-control" id="bmi" name="bmi" required></div>
        
                    <div class="mb-3"><label for="diabetes_pedigree_function">Diabetes Pedigree Function:</label>
                    <input type="number" step="0.001" class="form-control" id="diabetes_pedigree_function" name="diabetes_pedigree_function" required></div>
                `;
            } 
            else if (disease === 'heart') {
                diseaseSpecificFields = `
                    <div class="mb-3"><label for="age" class="form-label">Age:</label>
                    <input type="number" class="form-control" id="age" name="age" required></div>
    
                    <div class="mb-3"><label for="sex">Sex:</label>
                    <input type="number" class="form-control" id="sex" name="sex" required></div>
        
                    <div class="mb-3"><label for="cp">Chest Pain Types:</label>
                    <input type="number" class="form-control" id="cp" name="cp" required></div>
        
                    <div class="mb-3"><label for="trestbps">Resting Blood Pressure:</label>
                    <input type="number" class="form-control" id="trestbps" name="trestbps" required></div>
        
                    <div class="mb-3"><label for="chol">Cholesterol Level:</label>
                    <input type="number" class="form-control" id="chol" name="chol" required></div>
        
                    <div class="mb-3"><label for="fbs">Fasting Blood Sugar:</label>
                    <input type="number" class="form-control" id="fbs" name="fbs" required></div>
        
                    <div class="mb-3"><label for="restecg">Resting ECG Results:</label>
                    <input type="number" class="form-control" id="restecg" name="restecg" required></div>
        
                    <div class="mb-3"><label for="thalach">Max Heart Rate:</label>
                    <input type="number" class="form-control" id="thalach" name="thalach" required></div>
        
                    <div class="mb-3"><label for="exang">Exercise Induced Angina:</label>
                    <input type="number" class="form-control" id="exang" name="exang" required></div>
        
                    <div class="mb-3"><label for="oldpeak">Oldpeak:</label>
                    <input type="number" class="form-control" id="oldpeak" name="oldpeak" required></div>
        
                    <div class="mb-3"><label for="slope">Slope:</label>
                    <input type="number" class="form-control" id="slope" name="slope" required></div>
        
                    <div class="mb-3"><label for="ca">CA:</label>
                    <input type="number" class="form-control" id="ca" name="ca" required></div>
        
                    <div class="mb-3"><label for="thal">Thal:</label>
                    <input type="number" class="form-control" id="thal" name="thal" required></div>
                `;
            } 
            
            }
        
            inputFields.innerHTML = diseaseSpecificFields;
        }
        
        function submitForm(event) {
            event.preventDefault();  
            let formData = new FormData(document.getElementById("prediction-form"));
            let disease = document.getElementById("disease").value; 
            console.log(formData);
            console.log(disease);

            fetch(`http://127.0.0.1:8000/Medi/predict/${disease}/`, {  
                method: 'POST',
                body: formData,
            })
            
            .then(response => response.json())
            .then(data => {
                
                if (data.prediction) {
                    res=document.getElementById("result")
                    if (data.prediction=='1'){
                        res.innerHTML=`The person is prone to ${disease}!!`
                    }
                    else{
                        res.innerHTML=`The person is prone to ${disease}!!`
                    }
                    
                } else {
                    alert("Error in prediction. Please try again.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred while processing the request.");
            });

        }
        
    </script>
</head>
<body class="container py-5">
    <h1 class="text-center">Disease Prediction System</h1>
    <form id="prediction-form" class="mt-4" onsubmit="submitForm(event)" method="POST">
        {% csrf_token %}
        <label for="disease" class="form-label">Select Disease:</label>
        <select id="disease" name="disease" class="form-select" onchange="updateFields()">
            <option value="diabetes">Diabetes</option>
            <option value="heart">Heart Disease</option>
        </select>
        <div id="input-fields" class="mt-3"></div>
        <button type="submit" class="btn btn-primary w-100">Predict</button>
    </form>
    <div id="result" class="mt-3"></div>
</body>
</html>
