<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background: #1a76d1;
            color: white;
            text-align: center;
            padding: 1rem;
            font-size: 1.5rem;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .patient-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-left: 5px solid #1a76d1;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            transition: transform 0.2s;
        }

        .patient-card:hover {
            transform: scale(1.02);
        }

        .patient-card p {
            margin: 5px 0;
            font-size: 1rem;
        }

        .patient-card strong {
            color: #333;
        }

        @media (max-width: 768px) {
            main {
                width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Patient History</h1>
    </header>

    <main>
        <section id="patients">
        </section>
    </main>

    <script>
        let patients = JSON.parse('{{ patients|safe|escapejs }}');

        function displayPatients() {
            const section = document.getElementById("patients");
            section.innerHTML = "";

            if (patients.length === 0) {
                section.innerHTML = `<i>No patients found.</i>`;
                return;
            }

            patients.forEach((patient, index) => {
                section.innerHTML += `
                    <div class="patient-card">
                        <p><strong>Name:</strong> ${patient.name}</p>
                        <p><strong>Age:</strong> ${patient.age}</p>
                        <p><strong>Gender:</strong> ${patient.gender}</p>
                        <p><strong>Last Visit:</strong> ${patient.last_visit}</p>
                        <p><strong>Diagnosis:</strong> ${patient.diagnosis}</p>
                    </div>
                `;
            });
        }

        displayPatients();
    </script>
</body>

</html>
